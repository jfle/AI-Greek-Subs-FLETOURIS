services:
  ai-greek-subs:
    image: ghcr.io/jfle/ai-greek-subs-fletouris:latest
    build: .
    container_name: ai-greek-subs-fletouris
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - ./data:/data
    environment:
      # Public HTTPS address Stremio will use (set this once you have HTTPS / a domain / a tunnel):
      # PUBLIC_URL: https://subs.example.com
      # Password protecting the configuration page (recommended when it is reachable from the internet):
      # CONFIG_PASSWORD: change-me
      CACHE_DAYS: "30"
