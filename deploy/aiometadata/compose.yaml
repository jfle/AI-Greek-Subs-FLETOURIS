name: stremio-aiometadata

services:
  aiometadata:
    image: ghcr.io/cedya77/aiometadata:latest
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: sqlite://addon/data/db.sqlite
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3232:3232"
    volumes:
      - addon_data:/app/addon/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3232/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  addon_data:
  redis_data:
