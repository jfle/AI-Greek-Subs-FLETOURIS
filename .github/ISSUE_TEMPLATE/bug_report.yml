name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your addon link, API keys or tokens** — they give access to your account.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown at the bottom of the configure page, or at /health
      placeholder: "1.7.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [One-file installer, git clone + install.sh, Docker, Manual (node server.js)]
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Server hardware / OS
      placeholder: "Raspberry Pi 4, Raspberry Pi OS Bookworm"
  - type: input
    id: provider
    attributes:
      label: AI provider and model
      placeholder: "Sign in with ChatGPT, gpt-6-luna"
  - type: input
    id: stremio
    attributes:
      label: Stremio app and platform
      placeholder: "Stremio 5 on Windows / Android TV / web"
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: "`journalctl -u aio-streams-subtitles-greek -n 100` (or `docker logs`). Remove anything personal."
      render: text
