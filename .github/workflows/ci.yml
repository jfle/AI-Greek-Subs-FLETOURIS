name: CI

on:
  push:
    branches: [polycue-ai]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  installer:
    name: Installer and Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: shellcheck -S warning install.sh build-installer.sh polycue-config
      - name: Build single-file installer
        run: bash build-installer.sh
      - name: Verify standalone installer and preserve a pre-existing AIOStreams installation
        run: |
          sudo mkdir -p /opt/aiostreams
          printf 'preserve-me\n' | sudo tee /opt/aiostreams/compose.yaml
          sudo bash dist/polycue-ai-installer.sh --https none --password ci-fixture-password
          curl -fsS http://127.0.0.1:7000/health
          curl -fsS http://127.0.0.1:7000/manifest.json | grep -F 'PolyCue AI'
          sudo polycue-config | grep -E '^Configuration page: http://[^ ]+:7000/configure$'
          sudo polycue-config | grep -Fx 'Configuration password: ci-fixture-password'
          sudo bash dist/polycue-ai-installer.sh --uninstall --purge
          test ! -e /usr/local/bin/polycue-config
          sudo grep -Fx 'preserve-me' /opt/aiostreams/compose.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: polycue-ai-installer
          path: dist/*
      - name: Build Docker image
        run: |
          docker build -t polycue-ai:ci .
          docker run -d --name aigs-ci -p 7001:7000 polycue-ai:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7001/health && break; sleep 1; done
          docker rm -f aigs-ci
