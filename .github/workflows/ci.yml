name: AIOStreams standalone checks
on:
  push:
    branches: [aiostreams-standalone]
  pull_request:
    branches: [aiostreams-standalone]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n install.sh && shellcheck -S warning install.sh
      - run: |
          printf 'BASE_URL=http://localhost:3000\nSECRET_KEY=example\nAIOSTREAMS_AUTH=admin:example\n' > .env
          docker compose config --quiet
