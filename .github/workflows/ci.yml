name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  installer:
    name: Installer and Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        run: shellcheck -S warning install.sh build-installer.sh
      - name: Build single-file installer
        run: bash build-installer.sh
      - name: Install with the built installer (HTTP mode, with AIOStreams) and check both services
        run: |
          sudo bash dist/aio-streams-subtitles-greek-installer.sh --https none
          curl -fsS http://127.0.0.1:7000/health
          curl -fsS http://127.0.0.1:7000/manifest.json
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 3; done
          curl -fsS -o /dev/null -w 'AIOStreams HTTP %{http_code}\n' http://127.0.0.1:3000/
          sudo grep -q '^AIOSTREAMS_AUTH=admin:' /opt/aiostreams/.env
          sudo bash dist/aio-streams-subtitles-greek-installer.sh --no-aiostreams
          ! docker ps --format '{{.Names}}' | grep -qx aiostreams
          sudo bash dist/aio-streams-subtitles-greek-installer.sh --uninstall --purge
      - name: Build Docker image
        run: |
          docker build -t aio-streams-subtitles-greek:ci .
          docker run -d --name aigs-ci -p 7001:7000 aio-streams-subtitles-greek:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7001/health && break; sleep 1; done
          docker rm -f aigs-ci
