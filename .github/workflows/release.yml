name: Release

# Push a tag like polycue-v4.0.0 to publish: GitHub release with the single-file installer + source tarball,
# and a multi-arch Docker image at ghcr.io/<owner>/polycue-ai.
on:
  push:
    tags: ['polycue-v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Check that the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "polycue-v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - name: Build installer
        run: bash build-installer.sh
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#polycue-v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ### Install / update (Debian, Ubuntu, Raspberry Pi OS, Armbian)
          ```bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/polycue-ai-installer.sh
          sudo bash polycue-ai-installer.sh
          ```
          MD
          echo "Docker: \`ghcr.io/${{ github.repository_owner }}/polycue-ai:$v\` (or \`:latest\`) — see [INSTALL.md](https://github.com/${{ github.repository }}/blob/polycue-ai/INSTALL.md)." >> notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/polycue-ai-installer.sh
            dist/polycue-ai-*.tar.gz
          make_latest: false
          name: PolyCue AI ${{ github.ref_name }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/polycue-ai
          tags: |
            type=match,pattern=polycue-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
